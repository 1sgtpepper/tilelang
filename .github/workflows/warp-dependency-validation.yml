name: Warp reduction dependency validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wheel:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Retrieve and verify the pinned Torch wheel
        run: |
          set -euo pipefail
          mkdir wheels
          curl --fail --location --show-error --silent --retry 3 --max-time 900 \
            'https://download-r2.pytorch.org/whl/cu130/torch-2.14.1%2Bcu130-cp312-cp312-manylinux_2_28_x86_64.whl' \
            --output wheels/torch-2.14.1+cu130-cp312-cp312-manylinux_2_28_x86_64.whl
          printf '%s  %s\n' \
            5359b255ac68c0cabb8293952b38e00f0d1a570815cd87f19b61af702c071410 \
            wheels/torch-2.14.1+cu130-cp312-cp312-manylinux_2_28_x86_64.whl \
            | sha256sum --check --strict
          stat --format='%n %s bytes' wheels/*.whl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: torch-cu130-cp312
          path: wheels/*.whl
          retention-days: 1
          compression-level: 0
