name: Warp gated ballot comparison
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact ballot candidate commit
        required: true
        type: string
permissions:
  contents: read
jobs:
  comparison:
    runs-on: [self-hosted, linux, x64, warp-validation]
    timeout-minutes: 10
    env:
      PROBE_RESULTS: ${{ runner.temp }}/warp-gated-${{ github.run_id }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          path: validation
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: 194c1b897aa5269e9a89d44c88efdf578a3df620
          path: baseline
          persist-credentials: false
      - name: Verify exact sources and environment
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          mkdir -p "$PROBE_RESULTS"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git -C baseline rev-parse HEAD)" = 194c1b897aa5269e9a89d44c88efdf578a3df620
          git -C source submodule update --init --depth=1 3rdparty/cutlass
          for tree in baseline source; do
            git -C "$tree" ls-tree HEAD 3rdparty/cutlass | tee "$PROBE_RESULTS/$tree-cutlass.txt"
            git -C "$tree" rev-parse HEAD | tee "$PROBE_RESULTS/$tree-commit.txt"
            git -C "$tree" ls-tree -r HEAD src/tl_templates | grep -v 'cuda/reduce.h$' > "$PROBE_RESULTS/$tree-other-templates.txt"
          done
          cmp "$PROBE_RESULTS"/baseline-cutlass.txt "$PROBE_RESULTS"/source-cutlass.txt
          cmp "$PROBE_RESULTS"/baseline-other-templates.txt "$PROBE_RESULTS"/source-other-templates.txt
          sha256sum {baseline,source}/src/tl_templates/cuda/reduce.h validation/validation/warp-gated-comparison.cu | tee "$PROBE_RESULTS"/source.sha256
          nvcc --version | tee "$PROBE_RESULTS"/nvcc.txt
          /usr/bin/g++-15 --version | tee "$PROBE_RESULTS"/gcc.txt
          nvidia-smi --query-gpu=name,compute_cap,memory.total,driver_version,clocks.sm,temperature.gpu,utilization.gpu --format=csv,noheader | tee "$PROBE_RESULTS"/gpu-before.txt
      - name: Compile the exact headers and two proven gates
        run: |
          set -euo pipefail
          cuda_nvcc=$(readlink -f "$(command -v nvcc)")
          cuda_root=$(dirname "$(dirname "$cuda_nvcc")")
          args=(-std=c++17 -O3 -arch=sm_120 -ccbin /usr/bin/g++-15 -I "$cuda_root/include/cccl" -I source/3rdparty/cutlass/include)
          fixture=validation/validation/warp-gated-comparison.cu
          for variant in baseline ballot hybrid xgate; do
            tree=$variant
            extra=()
            if [[ "$variant" == ballot ]]; then tree=source; fi
            if [[ "$variant" == hybrid ]]; then tree=source; extra=(-DPROBE_HYBRID); fi
            if [[ "$variant" == xgate ]]; then tree=source; extra=(-DPROBE_XGATE); fi
            "$cuda_nvcc" "${args[@]}" -I "$tree/src" -DPROBE_VARIANT="$variant" "${extra[@]}" -Xptxas=-v -c "$fixture" -o "$variant.o" 2>&1 | tee "$PROBE_RESULTS/$variant-compile.log"
            "$cuda_nvcc" "${args[@]}" -I "$tree/src" -DPROBE_VARIANT="$variant" "${extra[@]}" --ptx "$fixture" -o "$PROBE_RESULTS/$variant.ptx"
          done
          "$cuda_nvcc" "${args[@]}" -I source/src -DPROBE_DRIVER -c "$fixture" -o driver.o
          "$cuda_nvcc" "${args[@]}" driver.o baseline.o ballot.o hybrid.o xgate.o -o baseline-comparison
      - name: Check outputs and measure bounded dependent calls
        run: |
          set -euo pipefail
          ./baseline-comparison | tee "$PROBE_RESULTS"/comparison.txt
          grep -q '^COMPARISON_OUTPUTS_AND_ONE_CALL_ORACLE=PASS$' "$PROBE_RESULTS"/comparison.txt
          nvidia-smi --query-gpu=clocks.sm,temperature.gpu,utilization.gpu --format=csv,noheader | tee "$PROBE_RESULTS"/gpu-after.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: warp-gated-comparison
          path: ${{ env.PROBE_RESULTS }}/
