name: Warp ballot versus redux count probe

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact ballot candidate commit
        required: true
        type: string

permissions:
  contents: read

jobs:
  comparison:
    runs-on: [self-hosted, linux, x64, warp-validation]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          path: validation
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: 194c1b897aa5269e9a89d44c88efdf578a3df620
          path: baseline
          persist-credentials: false
      - name: Verify exact sources and prepare the private header variant
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          PROBE_RESULTS="$RUNNER_TEMP/warp-redux-count-$GITHUB_RUN_ID"
          echo "PROBE_RESULTS=$PROBE_RESULTS" >> "$GITHUB_ENV"
          mkdir -p "$PROBE_RESULTS/redux/src/tl_templates/cuda" "$PROBE_RESULTS/codegen"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git -C baseline rev-parse HEAD)" = 194c1b897aa5269e9a89d44c88efdf578a3df620
          git -C validation rev-parse HEAD | tee "$PROBE_RESULTS/validation-commit.txt"
          baseline_cutlass=$(git -C baseline rev-parse HEAD:3rdparty/cutlass)
          source_cutlass=$(git -C source rev-parse HEAD:3rdparty/cutlass)
          test "$baseline_cutlass" = "$source_cutlass"
          git -C source submodule update --init --depth=1 3rdparty/cutlass
          test "$(git -C source/3rdparty/cutlass rev-parse HEAD)" = "$source_cutlass"
          echo "CUTLASS_SHA=$source_cutlass" >> "$GITHUB_ENV"
          for tree in baseline source; do
            git -C "$tree" rev-parse HEAD | tee "$PROBE_RESULTS/$tree-commit.txt"
            git -C "$tree" ls-tree HEAD 3rdparty/cutlass | tee "$PROBE_RESULTS/$tree-cutlass.txt"
            git -C "$tree" ls-tree -r HEAD src/tl_templates \
              | grep -v 'cuda/reduce.h$' > "$PROBE_RESULTS/$tree-other-templates.txt"
            sha256sum "$tree/src/tl_templates/cuda/reduce.h" \
              | tee "$PROBE_RESULTS/$tree-reduce.sha256"
          done
          cmp "$PROBE_RESULTS/baseline-other-templates.txt" \
            "$PROBE_RESULTS/source-other-templates.txt"
          sha256sum validation/validation/warp-gated-comparison.cu \
            validation/validation/warp-reduce-check.cu \
            validation/validation/warp-codegen-check.cu \
            validation/validation/warp-codegen-check.py \
            | tee "$PROBE_RESULTS/validation-inputs.sha256"
          nvcc --version | tee "$PROBE_RESULTS/nvcc.txt"
          /usr/bin/g++-15 --version | tee "$PROBE_RESULTS/gcc.txt"
          nvidia-smi --query-gpu=name,compute_cap,memory.total,driver_version,clocks.sm,temperature.gpu,utilization.gpu --format=csv,noheader \
            | tee "$PROBE_RESULTS/gpu-before.txt"
          python3 - "$PROBE_RESULTS/redux/src/tl_templates/cuda/reduce.h" \
            "$PROBE_RESULTS/redux-header.diff" <<'PY'
          import difflib
          import hashlib
          import sys
          from pathlib import Path

          source = Path("source/src/tl_templates/cuda/reduce.h")
          target = Path(sys.argv[1])
          old = """  // A synchronized ballot preserves the launched prefix across scheduling.
            const uint32_t warp_mask = __ballot_sync(mask, true);
            if (warp_mask != mask) {
              const int thread_idx =
                  threadIdx.x + blockDim.x * (threadIdx.y + blockDim.y * threadIdx.z);
              const int lane = thread_idx % 32;
              const int warp_threads = __popc(warp_mask);
          """
          new = """  // Recover the dense launched cohort width without an active-mask snapshot.
          #if defined(__CUDA_ARCH__) && (__CUDA_ARCH__ >= 800)
            const int warp_threads = __reduce_add_sync(mask, 1);
            if (warp_threads < 32) {
              const uint32_t warp_mask = (1u << warp_threads) - 1u;
          #else
            const uint32_t warp_mask = __ballot_sync(mask, true);
            if (warp_mask != mask) {
              const int warp_threads = __popc(warp_mask);
          #endif
            const int thread_idx =
                threadIdx.x + blockDim.x * (threadIdx.y + blockDim.y * threadIdx.z);
            const int lane = thread_idx % 32;
          """
          text = source.read_text(encoding="utf-8")
          if text.count(old) != 1:
              raise SystemExit("expected exactly one generic ballot/count block in source header")
          transformed = text.replace(old, new, 1)
          target.write_text(transformed, encoding="utf-8")
          diff = difflib.unified_diff(
              text.splitlines(keepends=True), transformed.splitlines(keepends=True),
              fromfile=str(source), tofile="redux-count-prototype/reduce.h")
          Path(sys.argv[2]).write_text("".join(diff), encoding="utf-8")
          print("prototype header SHA256=" + hashlib.sha256(target.read_bytes()).hexdigest())
          PY
      - name: Run the 5,480-case direct oracle on baseline, ballot, and redux
        run: |
          set -euo pipefail
          cuda_nvcc=$(readlink -f "$(command -v nvcc)")
          cuda_root=$(dirname "$(dirname "$cuda_nvcc")")
          fixture=validation/validation/warp-reduce-check.cu
          for variant in baseline ballot redux; do
            case "$variant" in
              baseline) include_root=baseline/src; include_tail=() ;;
              ballot) include_root=source/src; include_tail=() ;;
              redux)
                include_root="$PROBE_RESULTS/redux/src"
                include_tail=(-I source/src/tl_templates/cuda -I source/src)
                ;;
            esac
            "$cuda_nvcc" -std=c++17 -O3 -arch=sm_120 -ccbin /usr/bin/g++-15 \
              -I "$cuda_root/include/cccl" -I "$include_root" "${include_tail[@]}" \
              -I source/3rdparty/cutlass/include "$fixture" \
              -o "$PROBE_RESULTS/oracle-$variant"
            status=0
            "$PROBE_RESULTS/oracle-$variant" > "$PROBE_RESULTS/oracle-$variant.txt" 2>&1 || status=$?
            cat "$PROBE_RESULTS/oracle-$variant.txt"
            if [[ "$variant" == baseline ]]; then
              test "$status" = 1
              grep -q '^SEMANTIC_FAILURE ' "$PROBE_RESULTS/oracle-$variant.txt"
              grep -Eq '^CASES=5480 FAILURES=[1-9][0-9]*$' "$PROBE_RESULTS/oracle-$variant.txt"
            else
              test "$status" = 0
              grep -q '^CASES=5480 FAILURES=0$' "$PROBE_RESULTS/oracle-$variant.txt"
            fi
          done
      - name: Compile PTX controls and inspect baseline-to-ballot codegen
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          cuda_nvcc=$(readlink -f "$(command -v nvcc)")
          cuda_root=$(dirname "$(dirname "$cuda_nvcc")")
          fixture=validation/validation/warp-codegen-check.cu
          for target in sm_75 sm_120 sm_100a sm_100f; do
            for variant in base candidate redux; do
              case "$variant" in
                base) include_root=baseline/src; include_tail=() ;;
                candidate) include_root=source/src; include_tail=() ;;
                redux)
                  include_root="$PROBE_RESULTS/redux/src"
                  include_tail=(-I source/src/tl_templates/cuda -I source/src)
                  ;;
              esac
              output="$PROBE_RESULTS/codegen/$variant-$target.ptx"
              "$cuda_nvcc" --ptx -std=c++17 -O3 "-arch=$target" \
                -ccbin /usr/bin/g++-15 -I "$cuda_root/include/cccl" \
                -I "$include_root" "${include_tail[@]}" \
                -I source/3rdparty/cutlass/include "$fixture" -o "$output" \
                2>&1 | tee "$PROBE_RESULTS/codegen/$variant-$target.compile.log"
            done
          done
          python3 validation/validation/warp-codegen-check.py "$PROBE_RESULTS/codegen" \
            --base-sha 194c1b897aa5269e9a89d44c88efdf578a3df620 \
            --patch-sha "$SOURCE_SHA" --cutlass-sha "$CUTLASS_SHA" \
            --output-json "$PROBE_RESULTS/codegen/ballot-codegen-report.json" \
            | tee "$PROBE_RESULTS/codegen/ballot-codegen-summary.txt"
          python3 - "$PROBE_RESULTS/codegen" \
            validation/validation/warp-codegen-check.py \
            > "$PROBE_RESULTS/codegen/redux-codegen-check.txt" <<'PY'
          import importlib.util
          import sys
          from pathlib import Path

          ptx_dir, checker_path = Path(sys.argv[1]), Path(sys.argv[2])
          spec = importlib.util.spec_from_file_location("warp_codegen_check", checker_path)
          checker = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(checker)

          def body(variant, target, kernel):
              path = ptx_dir / f"{variant}-{target}.ptx"
              _, result = checker.kernel_body(checker.ptx_entries(path.read_text()), kernel)
              return result

          def metrics(variant, target, kernel):
              return checker.inspect(body(variant, target, kernel))

          checked = []
          for target in ("sm_75", "sm_120", "sm_100a", "sm_100f"):
              if checker.normalize(body("candidate", target, "warp_codegen_i32_sum")) != \
                      checker.normalize(body("redux", target, "warp_codegen_i32_sum")):
                  raise SystemExit(f"{target}: redux prototype changed integer fast path")
              if target == "sm_100a":
                  for op in ("min", "max"):
                      kernel = f"warp_codegen_f32_{op}"
                      if checker.normalize(body("candidate", target, kernel)) != \
                              checker.normalize(body("redux", target, kernel)):
                          raise SystemExit(f"{target}: redux prototype changed native f32 {op}")
              if target == "sm_75":
                  for kernel in checker.KERNELS:
                      if checker.normalize(body("candidate", target, kernel)) != \
                              checker.normalize(body("redux", target, kernel)):
                          raise SystemExit(f"{target}: pre-SM80 fallback differs for {kernel}")
              kernels = [("warp_codegen_f32_sum", 1), ("warp_codegen_f64_sum", 2)]
              if target != "sm_100a":
                  kernels.extend((f"warp_codegen_f32_{op}", 1) for op in ("min", "max"))
              for kernel, words in kernels:
                  ballot = metrics("candidate", target, kernel)
                  redux = metrics("redux", target, kernel)
                  expected = [str(offset) for offset in (16, 8, 4, 2, 1) for _ in range(words)]
                  for name, data in (("ballot", ballot), ("redux", redux)):
                      offsets = [item["lane_or_delta"] for item in data["shuffle_operands"]["bfly"]]
                      if offsets != expected:
                          raise SystemExit(f"{target} {kernel}: {name} full XOR sequence changed")
                  for name, data in (("ballot", ballot), ("redux", redux)):
                      down = data["shuffle_operands"]["down"]
                      if len(down) != 5 * words or any(item["width"] != "b32" for item in down):
                          raise SystemExit(f"{target} {kernel}: {name} down-shuffle shape changed")
                  if ballot["shuffle_operands"]["idx"] != redux["shuffle_operands"]["idx"]:
                      raise SystemExit(f"{target} {kernel}: lane-zero broadcast changed")
                  if target != "sm_75":
                      count_ops = redux["redux_counts"].get("add.s32", 0) + \
                          redux["redux_counts"].get("add.u32", 0)
                      if count_ops != 1:
                          raise SystemExit(f"{target} {kernel}: expected one 32-bit redux.add participant count")
                      if ballot["opcode_counts"].get("vote.sync.ballot.b32", 0) != 1:
                          raise SystemExit(f"{target} {kernel}: expected one ballot baseline")
                  checked.append((target, kernel, ballot, redux))

          print("Integer/native SM100 paths and SM75 fallback match the ballot header.")
          for target, kernel, ballot, redux in checked:
              print("{} {} shfl bfly/down/idx ballot={}/{}/{} redux={}/{}/{}; redux.add.32={}".format(
                  target, kernel,
                  ballot["shuffle_counts"].get("bfly", 0),
                  ballot["shuffle_counts"].get("down", 0),
                  ballot["shuffle_counts"].get("idx", 0),
                  redux["shuffle_counts"].get("bfly", 0),
                  redux["shuffle_counts"].get("down", 0),
                  redux["shuffle_counts"].get("idx", 0),
                  redux["redux_counts"].get("add.s32", 0)
                  + redux["redux_counts"].get("add.u32", 0)))
          PY
      - name: Compile paired timing kernels and record ptxas resources
        run: |
          set -euo pipefail
          cuda_nvcc=$(readlink -f "$(command -v nvcc)")
          cuda_root=$(dirname "$(dirname "$cuda_nvcc")")
          args=(-std=c++17 -O3 -arch=sm_120 -ccbin /usr/bin/g++-15 \
            -I "$cuda_root/include/cccl" -I source/3rdparty/cutlass/include)
          fixture=validation/validation/warp-gated-comparison.cu
          for variant in baseline ballot redux; do
            case "$variant" in
              baseline) include_root=baseline/src; include_tail=() ;;
              ballot) include_root=source/src; include_tail=() ;;
              redux)
                include_root="$PROBE_RESULTS/redux/src"
                include_tail=(-I source/src/tl_templates/cuda -I source/src)
                ;;
            esac
            "$cuda_nvcc" "${args[@]}" -I "$include_root" "${include_tail[@]}" \
              -DPROBE_VARIANT="$variant" -Xptxas=-v -c "$fixture" \
              -o "$PROBE_RESULTS/$variant.o" \
              2>&1 | tee "$PROBE_RESULTS/$variant-ptxas.txt"
            "$cuda_nvcc" "${args[@]}" -I "$include_root" "${include_tail[@]}" \
              -DPROBE_VARIANT="$variant" --ptx "$fixture" \
              -o "$PROBE_RESULTS/$variant-sm_120.ptx"
          done
          "$cuda_nvcc" "${args[@]}" -I source/src -DPROBE_DRIVER -c "$fixture" \
            -o "$PROBE_RESULTS/driver.o"
          "$cuda_nvcc" "$PROBE_RESULTS/driver.o" "$PROBE_RESULTS/baseline.o" \
            "$PROBE_RESULTS/ballot.o" "$PROBE_RESULTS/redux.o" \
            -o "$PROBE_RESULTS/comparison"
      - name: Check outputs and measure bounded dependent calls
        run: |
          set -euo pipefail
          "$PROBE_RESULTS/comparison" | tee "$PROBE_RESULTS/comparison.txt"
          grep -q '^COMPARISON_OUTPUTS_AND_ONE_CALL_ORACLE=PASS$' "$PROBE_RESULTS/comparison.txt"
          nvidia-smi --query-gpu=clocks.sm,temperature.gpu,utilization.gpu --format=csv,noheader \
            | tee "$PROBE_RESULTS/gpu-after.txt"
          sha256sum "$PROBE_RESULTS"/*.ptx "$PROBE_RESULTS"/codegen/*.ptx \
            | tee "$PROBE_RESULTS/ptx.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: warp-redux-count-comparison
          path: ${{ runner.temp }}/warp-redux-count-${{ github.run_id }}/
