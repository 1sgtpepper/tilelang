name: Warp partial stage probe

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact ballot candidate commit
        required: true
        type: string

permissions:
  contents: read

jobs:
  comparison:
    runs-on: [self-hosted, linux, x64, warp-validation]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          path: validation
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: 194c1b897aa5269e9a89d44c88efdf578a3df620
          path: baseline
          persist-credentials: false
      - name: Verify exact sources and prepare the private header variant
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          PROBE_RESULTS="$RUNNER_TEMP/warp-pruned-stage-$GITHUB_RUN_ID"
          echo "PROBE_RESULTS=$PROBE_RESULTS" >> "$GITHUB_ENV"
          mkdir -p "$PROBE_RESULTS/pruned/src/tl_templates/cuda" "$PROBE_RESULTS/codegen"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git -C baseline rev-parse HEAD)" = 194c1b897aa5269e9a89d44c88efdf578a3df620
          git -C validation rev-parse HEAD | tee "$PROBE_RESULTS/validation-commit.txt"
          baseline_cutlass=$(git -C baseline rev-parse HEAD:3rdparty/cutlass)
          source_cutlass=$(git -C source rev-parse HEAD:3rdparty/cutlass)
          test "$baseline_cutlass" = "$source_cutlass"
          git -C source submodule update --init --depth=1 3rdparty/cutlass
          test "$(git -C source/3rdparty/cutlass rev-parse HEAD)" = "$source_cutlass"
          echo "CUTLASS_SHA=$source_cutlass" >> "$GITHUB_ENV"
          for tree in baseline source; do
            git -C "$tree" rev-parse HEAD | tee "$PROBE_RESULTS/$tree-commit.txt"
            git -C "$tree" ls-tree HEAD 3rdparty/cutlass | tee "$PROBE_RESULTS/$tree-cutlass.txt"
            git -C "$tree" ls-tree -r HEAD src/tl_templates \
              | grep -v 'cuda/reduce.h$' > "$PROBE_RESULTS/$tree-other-templates.txt"
            sha256sum "$tree/src/tl_templates/cuda/reduce.h" \
              | tee "$PROBE_RESULTS/$tree-reduce.sha256"
          done
          cmp "$PROBE_RESULTS/baseline-other-templates.txt" \
            "$PROBE_RESULTS/source-other-templates.txt"
          sha256sum validation/validation/warp-gated-comparison.cu \
            validation/validation/warp-reduce-check.cu \
            validation/validation/warp-codegen-check.cu \
            validation/validation/warp-codegen-check.py \
            | tee "$PROBE_RESULTS/validation-inputs.sha256"
          nvcc --version | tee "$PROBE_RESULTS/nvcc.txt"
          /usr/bin/g++-15 --version | tee "$PROBE_RESULTS/gcc.txt"
          nvidia-smi --query-gpu=name,compute_cap,memory.total,driver_version,clocks.sm,temperature.gpu,utilization.gpu --format=csv,noheader \
            | tee "$PROBE_RESULTS/gpu-before.txt"
          python3 - "$PROBE_RESULTS/pruned/src/tl_templates/cuda/reduce.h" \
            "$PROBE_RESULTS/pruned-header.diff" <<'PY'
          import difflib
          import hashlib
          import sys
          from pathlib import Path

          source = Path("source/src/tl_templates/cuda/reduce.h")
          target = Path(sys.argv[1])
          old = """    for (int offset = 16; offset > 0; offset /= 2) {
                const bool has_partner = lane + offset < warp_threads;
                // Missing partners must still shuffle from a participating lane.
                const T other =
                    tl::shfl_down_sync(warp_mask, value, has_partner ? offset : 0);
                if (has_partner)
                  value = op(value, other);
              }
          """
          new = """    for (int offset = 16; offset > 0; offset /= 2) {
                if (warp_threads > offset) {
                  const bool has_partner = lane + offset < warp_threads;
                  // Missing partners must still shuffle from a participating lane.
                  const T other =
                      tl::shfl_down_sync(warp_mask, value, has_partner ? offset : 0);
                  if (has_partner)
                    value = op(value, other);
                }
              }
          """
          text = source.read_text(encoding="utf-8")
          if text.count(old) != 1:
              raise SystemExit("expected exactly one current partial shuffle loop in source header")
          transformed = text.replace(old, new, 1)
          target.write_text(transformed, encoding="utf-8")
          diff = difflib.unified_diff(
              text.splitlines(keepends=True), transformed.splitlines(keepends=True),
              fromfile=str(source), tofile="pruned-stage-prototype/reduce.h")
          Path(sys.argv[2]).write_text("".join(diff), encoding="utf-8")
          print("prototype header SHA256=" + hashlib.sha256(target.read_bytes()).hexdigest())
          PY
          # Keep local TileLang headers beside reduce.h for its quoted include,
          # but do not add that directory as an include root: it shadows CUDA's
          # <cuda_fp8.h> with TileLang's same-named wrapper.
          cp source/src/tl_templates/cuda/common.h \
            "$PROBE_RESULTS/pruned/src/tl_templates/cuda/common.h"
      - name: Run the 5,480-case direct oracle on baseline, ballot, and pruned
        run: |
          set -euo pipefail
          cuda_nvcc=$(readlink -f "$(command -v nvcc)")
          cuda_root=$(dirname "$(dirname "$cuda_nvcc")")
          fixture=validation/validation/warp-reduce-check.cu
          for variant in baseline ballot pruned; do
            case "$variant" in
              baseline) include_root=baseline/src ;;
              ballot) include_root=source/src ;;
              pruned) include_root="$PROBE_RESULTS/pruned/src" ;;
            esac
            "$cuda_nvcc" -std=c++17 -O3 -arch=sm_120 -ccbin /usr/bin/g++-15 \
              -I "$cuda_root/include/cccl" -I "$include_root" \
              -I source/3rdparty/cutlass/include "$fixture" \
              -o "$PROBE_RESULTS/oracle-$variant"
            status=0
            "$PROBE_RESULTS/oracle-$variant" > "$PROBE_RESULTS/oracle-$variant.txt" 2>&1 || status=$?
            cat "$PROBE_RESULTS/oracle-$variant.txt"
            if [[ "$variant" == baseline ]]; then
              test "$status" = 1
              grep -q '^SEMANTIC_FAILURE ' "$PROBE_RESULTS/oracle-$variant.txt"
              grep -Eq '^CASES=5480 FAILURES=[1-9][0-9]*$' "$PROBE_RESULTS/oracle-$variant.txt"
            else
              test "$status" = 0
              grep -q '^CASES=5480 FAILURES=0$' "$PROBE_RESULTS/oracle-$variant.txt"
            fi
          done
      - name: Compile PTX controls and inspect baseline-to-ballot codegen
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          cuda_nvcc=$(readlink -f "$(command -v nvcc)")
          cuda_root=$(dirname "$(dirname "$cuda_nvcc")")
          fixture=validation/validation/warp-codegen-check.cu
          for target in sm_75 sm_120 sm_100a sm_100f; do
            for variant in base candidate pruned; do
              case "$variant" in
                base) include_root=baseline/src ;;
                candidate) include_root=source/src ;;
                pruned) include_root="$PROBE_RESULTS/pruned/src" ;;
              esac
              output="$PROBE_RESULTS/codegen/$variant-$target.ptx"
              "$cuda_nvcc" --ptx -std=c++17 -O3 "-arch=$target" \
                -ccbin /usr/bin/g++-15 -I "$cuda_root/include/cccl" \
                -I "$include_root" \
                -I source/3rdparty/cutlass/include "$fixture" -o "$output" \
                2>&1 | tee "$PROBE_RESULTS/codegen/$variant-$target.compile.log"
            done
          done
          python3 validation/validation/warp-codegen-check.py "$PROBE_RESULTS/codegen" \
            --base-sha 194c1b897aa5269e9a89d44c88efdf578a3df620 \
            --patch-sha "$SOURCE_SHA" --cutlass-sha "$CUTLASS_SHA" \
            --output-json "$PROBE_RESULTS/codegen/ballot-codegen-report.json" \
            | tee "$PROBE_RESULTS/codegen/ballot-codegen-summary.txt"
          python3 - "$PROBE_RESULTS/codegen" \
            validation/validation/warp-codegen-check.py \
            > "$PROBE_RESULTS/codegen/pruned-codegen-check.txt" <<'PY'
          import importlib.util
          import re
          import sys
          from pathlib import Path

          ptx_dir, checker_path = Path(sys.argv[1]), Path(sys.argv[2])
          spec = importlib.util.spec_from_file_location("warp_codegen_check", checker_path)
          checker = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(checker)

          def body(variant, target, kernel):
              path = ptx_dir / f"{variant}-{target}.ptx"
              _, result = checker.kernel_body(checker.ptx_entries(path.read_text()), kernel)
              return result

          def metrics(variant, target, kernel):
              text = body(variant, target, kernel)
              result = checker.inspect(text)
              for mode in ("bfly", "idx"):
                  for item in result["shuffle_operands"][mode]:
                      operand = item["lane_or_delta"]
                      if not operand.startswith("%"):
                          continue
                      register = re.escape(operand)
                      writes = re.findall(
                          rf"(?m)^\s*(?:@!?%[\w$]+\s+)?[\w.]+\s+{register}(?:\||,)", text)
                      constants = re.findall(
                          rf"(?m)^\s*mov\.(?:u32|b32)\s+{register},\s*([0-9]+);", text)
                      if len(writes) != 1 or len(constants) != 1:
                          raise SystemExit(f"{target} {kernel}: non-constant {mode} source {operand}")
                      item["lane_or_delta"] = constants[0]
              return result

          checked = []
          for target in ("sm_75", "sm_120", "sm_100a", "sm_100f"):
              if target != "sm_75" and checker.normalize(body("candidate", target, "warp_codegen_i32_sum")) != \
                      checker.normalize(body("pruned", target, "warp_codegen_i32_sum")):
                  raise SystemExit(f"{target}: pruned prototype changed integer fast path")
              if target == "sm_100a":
                  for op in ("min", "max"):
                      kernel = f"warp_codegen_f32_{op}"
                      if checker.normalize(body("candidate", target, kernel)) != \
                              checker.normalize(body("pruned", target, kernel)):
                          raise SystemExit(f"{target}: pruned prototype changed native f32 {op}")
              kernels = [("warp_codegen_f32_sum", 1), ("warp_codegen_f64_sum", 2)]
              if target != "sm_100a":
                  kernels.extend((f"warp_codegen_f32_{op}", 1) for op in ("min", "max"))
              for kernel, words in kernels:
                  ballot = metrics("candidate", target, kernel)
                  pruned = metrics("pruned", target, kernel)
                  expected = [str(offset) for offset in (16, 8, 4, 2, 1) for _ in range(words)]
                  for name, data in (("ballot", ballot), ("pruned", pruned)):
                      offsets = [item["lane_or_delta"] for item in data["shuffle_operands"]["bfly"]]
                      if offsets != expected:
                          raise SystemExit(f"{target} {kernel}: {name} full XOR sequence changed")
                  for name, data in (("ballot", ballot), ("pruned", pruned)):
                      down = data["shuffle_operands"]["down"]
                      if len(down) != 5 * words or any(item["width"] != "b32" for item in down):
                          raise SystemExit(f"{target} {kernel}: {name} down-shuffle shape changed")
                  if ballot["shuffle_operands"]["idx"] != pruned["shuffle_operands"]["idx"]:
                      raise SystemExit(f"{target} {kernel}: lane-zero broadcast changed")
                  for name, data in (("ballot", ballot), ("pruned", pruned)):
                      if data["opcode_counts"].get("vote.sync.ballot.b32", 0) != 1:
                          raise SystemExit(f"{target} {kernel}: expected one ballot in {name}")
                  checked.append((target, kernel, ballot, pruned))

          print("Integer/native SM100 paths match; generic full XOR and broadcasts preserved.")
          for target, kernel, ballot, pruned in checked:
              print(target, kernel, "ballot=", ballot, "pruned=", pruned)
          PY
      - name: Compile paired timing kernels and record ptxas resources
        run: |
          set -euo pipefail
          cuda_nvcc=$(readlink -f "$(command -v nvcc)")
          cuda_root=$(dirname "$(dirname "$cuda_nvcc")")
          args=(-std=c++17 -O3 -arch=sm_120 -ccbin /usr/bin/g++-15 \
            -I "$cuda_root/include/cccl" -I source/3rdparty/cutlass/include)
          fixture=validation/validation/warp-gated-comparison.cu
          for dtype in f32 f64 f16 bf16; do
            case "$dtype" in
              f32) cpp_type=float ;;
              f64) cpp_type=double ;;
              f16) cpp_type=half_t ;;
              bf16) cpp_type=bfloat16_t ;;
            esac
            for variant in baseline ballot pruned; do
              case "$variant" in
                baseline) include_root=baseline/src ;;
                ballot) include_root=source/src ;;
                pruned) include_root="$PROBE_RESULTS/pruned/src" ;;
              esac
              "$cuda_nvcc" "${args[@]}" -I "$include_root" \
                -DPROBE_VARIANT="$variant" -DPROBE_TYPE="$cpp_type" -Xptxas=-v -c "$fixture" \
                -o "$PROBE_RESULTS/$dtype-$variant.o" \
                2>&1 | tee "$PROBE_RESULTS/$dtype-$variant-ptxas.txt"
              "$cuda_nvcc" "${args[@]}" -I "$include_root" \
                -DPROBE_VARIANT="$variant" -DPROBE_TYPE="$cpp_type" --ptx "$fixture" \
                -o "$PROBE_RESULTS/$dtype-$variant-sm_120.ptx"
            done
            "$cuda_nvcc" "${args[@]}" -I source/src -DPROBE_DRIVER -DPROBE_TYPE="$cpp_type" -c "$fixture" \
              -o "$PROBE_RESULTS/$dtype-driver.o"
            "$cuda_nvcc" "$PROBE_RESULTS/$dtype-driver.o" "$PROBE_RESULTS/$dtype-baseline.o" \
              "$PROBE_RESULTS/$dtype-ballot.o" "$PROBE_RESULTS/$dtype-pruned.o" \
              -o "$PROBE_RESULTS/$dtype-comparison"
          done
      - name: Check typed outputs and measure bounded dependent calls
        run: |
          set -euo pipefail
          for dtype in f32 f64 f16 bf16; do
            "$PROBE_RESULTS/$dtype-comparison" | tee "$PROBE_RESULTS/$dtype-comparison.txt"
            grep -q '^COMPARISON_OUTPUTS_AND_ONE_CALL_ORACLE=PASS$' "$PROBE_RESULTS/$dtype-comparison.txt"
            grep -q '^SPECIAL_BIT_DIFFERENTIAL_CASES=3200$' "$PROBE_RESULTS/$dtype-comparison.txt"
          done
          nvidia-smi --query-gpu=clocks.sm,temperature.gpu,utilization.gpu --format=csv,noheader \
            | tee "$PROBE_RESULTS/gpu-after.txt"
          sha256sum "$PROBE_RESULTS"/*.ptx "$PROBE_RESULTS"/codegen/*.ptx \
            | tee "$PROBE_RESULTS/ptx.sha256"
      - name: Reuse pinned sanitizer on the pruned owner
        run: |
          set -euo pipefail
          sanitizer="$RUNNER_TOOL_CACHE/.warp-cache/tools/cuda_sanitizer_api-linux-x86_64-13.3.27-archive/compute-sanitizer/compute-sanitizer"
          test -x "$sanitizer"
          "$sanitizer" --version | tee "$PROBE_RESULTS/sanitizer-version.txt"
          sha256sum "$sanitizer" "$PROBE_RESULTS/oracle-pruned" \
            | tee "$PROBE_RESULTS/sanitizer-inputs.sha256"
          for tool in memcheck synccheck; do
            "$sanitizer" --tool "$tool" --error-exitcode 7 "$PROBE_RESULTS/oracle-pruned" \
              2>&1 | tee "$PROBE_RESULTS/$tool.txt"
            grep -q '^CASES=5480 FAILURES=0$' "$PROBE_RESULTS/$tool.txt"
            grep -q 'ERROR SUMMARY: 0 errors' "$PROBE_RESULTS/$tool.txt"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: warp-pruned-stage-comparison
          path: ${{ runner.temp }}/warp-pruned-stage-${{ github.run_id }}/
