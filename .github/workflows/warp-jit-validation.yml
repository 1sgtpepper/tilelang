# Header mode overlays the exact reducer template on an unchanged upstream wheel.
# Wheel mode builds the exact source commit and tests its installed default template.
# Both modes exercise the public warp-reduction API on the SM120 RTX 5070:
# f32 min/max use the generic shuffle path there, while int32 also exercises redux.
name: Warp reduction JIT validation

on:
  workflow_dispatch:
    inputs:
      validation_kind:
        description: Select header, exact-source wheel, or consumer validation
        required: true
        type: choice
        options:
          - header
          - wheel
          - consumer
        default: header
      source_sha:
        description: Exact fork commit containing the helper fix and regression tests
        required: true
        type: string
      softmax:
        description: Also measure paired full-kernel softmax in header mode
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: warp-reduction-jit-${{ github.repository }}-${{ inputs.validation_kind }}
  cancel-in-progress: false

jobs:
  cuda:
    if: ${{ inputs.validation_kind == 'header' }}
    runs-on: [self-hosted, linux, x64, warp-validation]
    timeout-minutes: 35
    env:
      CUDA_HOME: /home/sgtpepper/.local/cuda-13.3
      NVCC_CCBIN: /usr/bin/g++-15
      CXX: /usr/bin/g++-15
      TILELANG_DISABLE_CACHE: "1"
      UV_HTTP_TIMEOUT: "300"
      UV_CONCURRENT_DOWNLOADS: "3"
      PYTHONPATH: ""
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source and reusable host-code boundary
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          BASELINE_SHA=194c1b897aa5269e9a89d44c88efdf578a3df620
          WHEEL_SOURCE_SHA=adeea32bcecdddca32195a95e90730b175606a0e
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          git -C source cat-file -e "${BASELINE_SHA}^{commit}"
          git -C source cat-file -e "${WHEEL_SOURCE_SHA}^{commit}"
          git -C source merge-base --is-ancestor "$BASELINE_SHA" "$SOURCE_SHA"

          # The upstream wheel's host/native/codegen inputs were source-byte-
          # identical to 194c1b8. Keep reuse valid only for this header/test/doc
          # patch shape; a host-side change requires an exact-head package build.
          expected_files=$(printf '%s\n' \
            docs/programming_guides/instructions.md \
            src/tl_templates/cuda/reduce.h \
            testing/python/language/test_tilelang_language_warp_reduce.py)
          actual_files=$(git -C source diff --name-only "$BASELINE_SHA" "$SOURCE_SHA" | LC_ALL=C sort)
          if [[ "$actual_files" != "$expected_files" ]]; then
            printf 'Unexpected files in source patch:\n%s\n' "$actual_files"
            exit 1
          fi

          git -C source diff --exit-code "$WHEEL_SOURCE_SHA" "$BASELINE_SHA" -- \
            src/cuda/codegen/codegen_cuda.cc \
            src/op/builtin.cc \
            tilelang/language/reduce_op.py \
            tilelang/jit/adapter/nvrtc/libgen.py \
            tilelang/env.py \
            tilelang/__init__.py \
            tilelang/libinfo.py \
            tilelang/testing/__init__.py \
            CMakeLists.txt \
            cmake/BackendOptions.cmake \
            cmake/FindPipCUDAToolkit.cmake \
            pyproject.toml \
            version_provider.py \
            3rdparty/tvm \
            3rdparty/cutlass

          printf 'SOURCE_SHA=%s\nBASELINE_SHA=%s\nWHEEL_SOURCE_SHA=%s\n' \
            "$SOURCE_SHA" "$BASELINE_SHA" "$WHEEL_SOURCE_SHA"
          git -C source submodule status 3rdparty/tvm 3rdparty/cutlass
          sha256sum \
            source/src/tl_templates/cuda/reduce.h \
            source/src/tl_templates/cuda/nvrtc_std.h \
            source/testing/python/language/test_tilelang_language_warp_reduce.py

      - name: Check out the softmax fixture
        if: ${{ inputs.softmax }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          path: validation
          persist-credentials: false

      - name: Verify pinned upstream wheel artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          command -v gh
          metadata=$(gh api repos/tile-ai/tilelang/actions/artifacts/11591218180 \
            --jq '[.id, .name, .size_in_bytes, .digest, (.expired | tostring), .workflow_run.head_sha] | @tsv')
          expected=$(printf '%s\t%s\t%s\t%s\t%s\t%s' \
            11591218180 \
            wheels-3.10-Linux-X64-CUDA-13.0 \
            49326603 \
            sha256:9bb426b22b2773782db29a25f28051812554ef1f5e312ad16cc9574855063302 \
            false \
            adeea32bcecdddca32195a95e90730b175606a0e)
          printf '%s\n' "$metadata"
          test "$metadata" = "$expected"

      - name: Download the pinned wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: wheels-3.10-Linux-X64-CUDA-13.0
          run-id: 37870584206
          repository: tile-ai/tilelang
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/tile-wheelhouse

      - name: Reuse Python 3.12 and dependency caches
        run: |
          set -euo pipefail
          command -v uv
          uv --version
          uv python find 3.12
          /usr/bin/g++-15 --version
          echo "$CUDA_HOME/bin" >> "$GITHUB_PATH"
          echo "UV_CACHE_DIR=$RUNNER_TOOL_CACHE/.warp-cache/uv" >> "$GITHUB_ENV"
          echo "PIP_CACHE_DIR=$RUNNER_TOOL_CACHE/.warp-cache/pip" >> "$GITHUB_ENV"

      - name: Install the wheel, matching Torch, and pytest
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/jit-results"
          mapfile -t wheels < <(find "${RUNNER_TEMP}/tile-wheelhouse" -maxdepth 1 -type f -name 'tilelang-*.whl' -print | sort)
          test "${#wheels[@]}" -eq 1
          wheel=${wheels[0]}
          case "$(basename "$wheel")" in
            tilelang-*-cp39-abi3-manylinux*x86_64.whl) ;;
            *) echo "Unexpected wheel filename: $wheel" >&2; exit 1 ;;
          esac
          sha256sum "$wheel" | tee "$GITHUB_WORKSPACE/jit-results/wheel.sha256"

          uv venv --python 3.12 "${RUNNER_TEMP}/tilelang-venv"
          uv pip install --python "${RUNNER_TEMP}/tilelang-venv/bin/python" \
            'https://download-r2.pytorch.org/whl/cu130/torch-2.14.1%2Bcu130-cp312-cp312-manylinux_2_28_x86_64.whl#sha256=5359b255ac68c0cabb8293952b38e00f0d1a570815cd87f19b61af702c071410'
          uv pip install --python "${RUNNER_TEMP}/tilelang-venv/bin/python" \
            "$wheel" 'pytest==9.1.1' 'cuda-bindings==13.4.3'

      - name: Prepare external test and template trees
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/tile-templates-baseline" "${RUNNER_TEMP}/tile-templates-patched"
          cp -a source/src/. "${RUNNER_TEMP}/tile-templates-baseline/"
          cp -a source/src/. "${RUNNER_TEMP}/tile-templates-patched/"
          git -C source show \
            194c1b897aa5269e9a89d44c88efdf578a3df620:src/tl_templates/cuda/reduce.h \
            > "${RUNNER_TEMP}/tile-templates-baseline/tl_templates/cuda/reduce.h"

          # This header is prepended by TileLang's NVRTC path. Keep it available
          # beside the selected reduce.h while the test itself runs outside the
          # checkout's testing/conftest.py import hook.
          cp source/src/tl_templates/cuda/nvrtc_std.h \
            "${RUNNER_TEMP}/tile-templates-baseline/tl_templates/cuda/nvrtc_std.h"
          cp source/src/tl_templates/cuda/nvrtc_std.h \
            "${RUNNER_TEMP}/tile-templates-patched/tl_templates/cuda/nvrtc_std.h"
          cp source/testing/python/language/test_tilelang_language_warp_reduce.py \
            "${RUNNER_TEMP}/test_tilelang_language_warp_reduce.py"
          cp source/testing/python/jit/test_tilelang_jit_nvrtc_std.py \
            "${RUNNER_TEMP}/test_tilelang_jit_nvrtc_std.py"

          {
            printf 'baseline_reduce.h '
            sha256sum "${RUNNER_TEMP}/tile-templates-baseline/tl_templates/cuda/reduce.h"
            printf 'patched_reduce.h '
            sha256sum "${RUNNER_TEMP}/tile-templates-patched/tl_templates/cuda/reduce.h"
            printf 'nvrtc_std.h '
            sha256sum "${RUNNER_TEMP}/tile-templates-patched/tl_templates/cuda/nvrtc_std.h"
            printf 'test_module '
            sha256sum "${RUNNER_TEMP}/test_tilelang_language_warp_reduce.py"
          } | tee "$GITHUB_WORKSPACE/jit-results/source-files.sha256"

      - name: Verify wheel imports, CUDA, Torch, and NVRTC
        working-directory: ${{ runner.temp }}
        env:
          TL_TEMPLATE_PATH: ${{ runner.temp }}/tile-templates-patched
          TILELANG_CACHE_DIR: ${{ runner.temp }}/tilelang-cache
        run: |
          set -euo pipefail
          nvcc --version | tee "$GITHUB_WORKSPACE/jit-results/nvcc.txt"
          nvidia-smi --query-gpu=name,compute_cap,memory.total,driver_version --format=csv,noheader \
            | tee "$GITHUB_WORKSPACE/jit-results/gpu.txt"
          "${RUNNER_TEMP}/tilelang-venv/bin/python" - <<'PY' | tee "$GITHUB_WORKSPACE/jit-results/runtime.txt"
          import importlib.metadata as metadata
          import os
          from pathlib import Path

          import torch
          import tilelang
          from tilelang.env import CUDA_HOME, TILELANG_TEMPLATE_PATH
          from cuda.bindings import nvrtc

          package_path = Path(tilelang.__file__).resolve()
          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          assert not package_path.is_relative_to(workspace / "source"), package_path
          assert Path(TILELANG_TEMPLATE_PATH).resolve() == Path(os.environ["TL_TEMPLATE_PATH"]).resolve()
          assert Path(TILELANG_TEMPLATE_PATH, "tl_templates/cuda/nvrtc_std.h").is_file()
          assert Path(CUDA_HOME).resolve() == Path(os.environ["CUDA_HOME"]).resolve()
          assert torch.cuda.is_available(), "CUDA is required for this validation"
          assert torch.cuda.device_count() == 1, "Use the single-GPU warp-validation runner"
          assert torch.cuda.get_device_capability(0) == (12, 0), "Use the SM120 warp-validation GPU"

          print(f"tilelang={metadata.version('tilelang')} path={package_path}")
          print(f"torch={torch.__version__} cuda={torch.version.cuda} path={Path(torch.__file__).resolve()}")
          for distribution in ("cuda-bindings", "cuda-python", "pytest"):
              try:
                  print(f"{distribution}={metadata.version(distribution)}")
              except metadata.PackageNotFoundError:
                  print(f"{distribution}=not-installed")
          print(f"cuda_home={Path(CUDA_HOME).resolve()}")
          print(f"gpu={torch.cuda.get_device_name(0)} capability={torch.cuda.get_device_capability(0)}")
          result, major, minor = nvrtc.nvrtcVersion()
          assert result == nvrtc.nvrtcResult.NVRTC_SUCCESS
          print(f"nvrtc={major}.{minor}")
          print(f"tilelang_disable_cache={os.environ.get('TILELANG_DISABLE_CACHE')}")
          PY

      - name: Prove the baseline header fails only the selected semantic assertion
        working-directory: ${{ runner.temp }}
        env:
          TL_TEMPLATE_PATH: ${{ runner.temp }}/tile-templates-baseline
          TILELANG_CACHE_DIR: ${{ runner.temp }}/tilelang-cache-baseline
        run: |
          set -euo pipefail
          python_bin="${RUNNER_TEMP}/tilelang-venv/bin/python"
          test_file="${RUNNER_TEMP}/test_tilelang_language_warp_reduce.py"
          node='test_warp_reduce_partial[min-float32-threads2]'
          "$python_bin" -m pytest --collect-only -q "$test_file" \
            | tee "$GITHUB_WORKSPACE/jit-results/collection.txt"
          matches=$(grep -Fc "::$node" "$GITHUB_WORKSPACE/jit-results/collection.txt")
          test "$matches" -eq 1

          set +e
          "$python_bin" -m pytest -q --junitxml="$GITHUB_WORKSPACE/jit-results/baseline.xml" \
            "${test_file}::${node}" > "$GITHUB_WORKSPACE/jit-results/baseline.log" 2>&1
          status=$?
          set -e
          cat "$GITHUB_WORKSPACE/jit-results/baseline.log"
          test "$status" -eq 1

          "$python_bin" - "$GITHUB_WORKSPACE/jit-results/baseline.xml" "$node" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          report, expected_name = sys.argv[1:]
          root = ET.parse(report).getroot()
          cases = root.findall(".//testcase")
          assert len(cases) == 1, f"expected one baseline case; got {len(cases)}"
          case = cases[0]
          assert case.get("name") == expected_name, case.get("name")
          failure = case.find("failure")
          assert failure is not None, "baseline did not fail as a test assertion"
          assert case.find("error") is None, "setup/runtime error is not semantic evidence"
          assert case.find("skipped") is None, "a skipped test is not semantic evidence"
          message = (failure.get("message") or "") + (failure.text or "")
          assert "Tensor-likes are not equal!" in message, message
          PY
          echo 'BASELINE_HEADER_EXPECTED_FAILURE=PASS' | tee -a "$GITHUB_WORKSPACE/jit-results/status.txt"

      - name: Run the full regression module with the exact input header
        working-directory: ${{ runner.temp }}
        env:
          TL_TEMPLATE_PATH: ${{ runner.temp }}/tile-templates-patched
          TILELANG_CACHE_DIR: ${{ runner.temp }}/tilelang-cache-patched
        run: |
          set -euo pipefail
          python_bin="${RUNNER_TEMP}/tilelang-venv/bin/python"
          test_file="${RUNNER_TEMP}/test_tilelang_language_warp_reduce.py"
          "$python_bin" -m pytest -q --junitxml="$GITHUB_WORKSPACE/jit-results/patched.xml" \
            "$test_file" 2>&1 | tee "$GITHUB_WORKSPACE/jit-results/patched.log"
          "$python_bin" - "$GITHUB_WORKSPACE/jit-results/patched.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          cases = root.findall(".//testcase")
          assert len(cases) == 185, f"expected 185 collected regression/control cases; got {len(cases)}"
          failures = [case.get("name") for case in cases if case.find("failure") is not None]
          errors = [case.get("name") for case in cases if case.find("error") is not None]
          skipped = [case.get("name") for case in cases if case.find("skipped") is not None]
          assert not failures, f"unexpected test failures: {failures}"
          assert not errors, f"unexpected test errors: {errors}"
          assert not skipped, f"CUDA regressions must not be skipped: {skipped}"
          print(f"PATCHED_CASES_PASSED={len(cases)}; SKIPPED=0")
          PY
          echo 'PATCHED_HEADER_FULL_MODULE=PASS' | tee -a "$GITHUB_WORKSPACE/jit-results/status.txt"

      - name: Prove the oracle detects an omitted tail member
        working-directory: ${{ runner.temp }}
        env:
          TL_TEMPLATE_PATH: ${{ runner.temp }}/tile-templates-omitted-tail
          TILELANG_CACHE_DIR: ${{ runner.temp }}/tilelang-cache-omitted-tail
        run: |
          set -euo pipefail
          python_bin="${RUNNER_TEMP}/tilelang-venv/bin/python"
          test_file="${RUNNER_TEMP}/test_tilelang_language_warp_reduce.py"
          cp -a "${RUNNER_TEMP}/tile-templates-patched" "$TL_TEMPLATE_PATH"
          "$python_bin" - <<'PY'
          import os
          from pathlib import Path

          header = Path(os.environ["TL_TEMPLATE_PATH"], "tl_templates/cuda/reduce.h")
          text = header.read_text()
          guard = "      if (has_partner)\n"
          assert text.count(guard) == 1, "mutation must touch only the tail arithmetic guard"
          header.write_text(text.replace(guard, "      if (has_partner && lane + offset != warp_threads - 1)\n"))
          PY
          sha256sum "$TL_TEMPLATE_PATH/tl_templates/cuda/reduce.h" \
            > "$GITHUB_WORKSPACE/jit-results/omitted-tail.sha256"
          nodes=(
            "${test_file}::test_warp_reduce_partial[min-float32-threads2]"
            "${test_file}::test_warp_reduce_partial[max-float32-threads2]"
            "${test_file}::test_warp_reduce_partial[bitand-int64-threads2]"
            "${test_file}::test_warp_reduce_partial[bitor-int64-threads2]"
          )
          set +e
          "$python_bin" -m pytest -q --junitxml="$GITHUB_WORKSPACE/jit-results/omitted-tail.xml" \
            "${nodes[@]}" > "$GITHUB_WORKSPACE/jit-results/omitted-tail.log" 2>&1
          status=$?
          set -e
          cat "$GITHUB_WORKSPACE/jit-results/omitted-tail.log"
          test "$status" -eq 1
          "$python_bin" - "$GITHUB_WORKSPACE/jit-results/omitted-tail.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          cases = ET.parse(sys.argv[1]).getroot().findall(".//testcase")
          expected = {
              "test_warp_reduce_partial[min-float32-threads2]",
              "test_warp_reduce_partial[max-float32-threads2]",
              "test_warp_reduce_partial[bitand-int64-threads2]",
              "test_warp_reduce_partial[bitor-int64-threads2]",
          }
          assert len(cases) == 4 and {case.get("name") for case in cases} == expected
          for case in cases:
              assert case.find("error") is None and case.find("skipped") is None
              failure = case.find("failure")
              assert failure is not None, f"oracle missed the mutation: {case.get('name')}"
              message = (failure.get("message") or "") + (failure.text or "")
              assert "Tensor-likes are not equal!" in message, message
          print("OMITTED_TAIL_EXPECTED_FAILURES=4; ERRORS=0; SKIPPED=0")
          PY
          echo 'OMITTED_TAIL_MUTATION=PASS' | tee -a "$GITHUB_WORKSPACE/jit-results/status.txt"

      - name: Run NVRTC controls
        working-directory: ${{ runner.temp }}
        env:
          TL_TEMPLATE_PATH: ${{ runner.temp }}/tile-templates-patched
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/tilelang-venv/bin/python" -m pytest -q \
            --junitxml="$GITHUB_WORKSPACE/jit-results/nvrtc.xml" \
            "${RUNNER_TEMP}/test_tilelang_jit_nvrtc_std.py" \
            2>&1 | tee "$GITHUB_WORKSPACE/jit-results/nvrtc.log"
          "${RUNNER_TEMP}/tilelang-venv/bin/python" - "$GITHUB_WORKSPACE/jit-results/nvrtc.xml" <<'PY'
          import sys, xml.etree.ElementTree as ET
          cases = ET.parse(sys.argv[1]).getroot().findall(".//testcase")
          assert len(cases) == 14, len(cases)
          assert all(not list(case) for case in cases), "NVRTC tests failed or skipped"
          print("NVRTC_CASES_PASSED=14; SKIPPED=0")
          PY

      - name: Check repository conventions
        working-directory: source
        run: |
          set -euo pipefail
          uvx --from pre-commit pre-commit run --files \
            src/tl_templates/cuda/reduce.h \
            testing/python/language/test_tilelang_language_warp_reduce.py \
            docs/programming_guides/instructions.md

      - name: Measure paired whole-kernel softmax
        if: ${{ inputs.softmax }}
        working-directory: ${{ runner.temp }}
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          mapfile -t wheels < <(find "$RUNNER_TEMP/tile-wheelhouse" -maxdepth 1 -type f -name 'tilelang-*.whl' -print)
          test "${#wheels[@]}" -eq 1
          wheel=${wheels[0]}
          baseline_sha=$(sha256sum "$RUNNER_TEMP/tile-templates-baseline/tl_templates/cuda/reduce.h" | cut -d' ' -f1)
          candidate_sha=$(sha256sum "$RUNNER_TEMP/tile-templates-patched/tl_templates/cuda/reduce.h" | cut -d' ' -f1)
          wheel_sha=$(sha256sum "$wheel" | cut -d' ' -f1)
          script="$GITHUB_WORKSPACE/validation/validation/warp-softmax-comparison.py"
          output="$RUNNER_TEMP/warp-softmax-$GITHUB_RUN_ID"
          args=(
            --baseline-template "$RUNNER_TEMP/tile-templates-baseline"
            --candidate-template "$RUNNER_TEMP/tile-templates-patched"
            --baseline-header-sha "$baseline_sha" --candidate-header-sha "$candidate_sha"
            --source-sha "$SOURCE_SHA"
            --wheel-source-sha adeea32bcecdddca32195a95e90730b175606a0e
            --wheel-path "$wheel" --wheel-sha "$wheel_sha"
          )
          mkdir -p "$output"
          "$RUNNER_TEMP/tilelang-venv/bin/python" - "$script" "$RUNNER_TEMP/softmax-empty-capture.py" <<'PY'
          from pathlib import Path
          import sys
          source = Path(sys.argv[1]).read_text()
          correct = "torch.cuda.graph(graph, stream=stream)"
          assert source.count(correct) == 1
          Path(sys.argv[2]).write_text(source.replace(correct, "torch.cuda.graph(graph)"))
          PY
          if "$RUNNER_TEMP/tilelang-venv/bin/python" "$RUNNER_TEMP/softmax-empty-capture.py" \
            "${args[@]}" --output-dir "$output/negative-capture" > "$output/negative-capture.log" 2>&1; then
            printf '%s\n' 'Empty-capture negative control unexpectedly passed' >&2
            exit 1
          fi
          "$RUNNER_TEMP/tilelang-venv/bin/python" - "$output/negative-capture.log" <<'PY'
          from pathlib import Path
          import sys
          log = Path(sys.argv[1]).read_text()
          assert "expected 128 captured kernel nodes; got 0" in log, log
          print("EMPTY_CAPTURE_NEGATIVE_CONTROL_FAILED_AS_EXPECTED")
          PY
          "$RUNNER_TEMP/tilelang-venv/bin/python" "$script" "${args[@]}" --output-dir "$output/measurement"

      - name: Upload paired softmax evidence
        if: ${{ always() && inputs.softmax }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: warp-softmax-comparison
          path: ${{ runner.temp }}/warp-softmax-${{ github.run_id }}/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: warp-reduction-jit-results
          path: jit-results/
          if-no-files-found: warn
          retention-days: 7

  consumer:
    if: ${{ inputs.validation_kind == 'consumer' }}
    name: Compare the unchanged Engram CUDA kernel
    runs-on: [self-hosted, linux, x64, warp-validation]
    timeout-minutes: 35
    env:
      CUDA_HOME: /home/sgtpepper/.local/cuda-13.3
      NVCC_CCBIN: /usr/bin/g++-15
      CXX: /usr/bin/g++-15
      TILELANG_DISABLE_CACHE: "1"
      UV_HTTP_TIMEOUT: "300"
      UV_CONCURRENT_DOWNLOADS: "3"
      PYTHONPATH: ""
    steps:
      - name: Check out exact reducer source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Check out comparison fixture
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          path: validation
          persist-credentials: false

      - name: Check out pinned consumer
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: deepseek-ai/TileKernels
          ref: 66258df6175d2f630ffecb04c5ab66bff8a2ae6a
          path: consumer
          persist-credentials: false

      - name: Verify the reusable exact-source wheel artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$SOURCE_SHA" = 5fe3f25fe9af1ff4b1d36f8814918a967d036f85
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          metadata=$(gh api repos/1sgtpepper/tilelang/actions/artifacts/11657493986 \
            --jq '[.id, .name, .size_in_bytes, .digest, (.expired | tostring), .workflow_run.head_sha] | @tsv')
          expected=$(printf '%s\t%s\t%s\t%s\t%s\t%s' \
            11657493986 tilelang-native-wheel 45831485 \
            sha256:0dfe4219c6d2e609b7e9a2c2466f6f48bf5b34516c629b5a10f6e30dd1ecc2d1 \
            false 63e35cfa83573a763a6257eb9432ee0386d6928b)
          test "$metadata" = "$expected"

      - name: Download the verified native wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: tilelang-native-wheel
          run-id: 38019827361
          repository: 1sgtpepper/tilelang
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/consumer-wheelhouse

      - name: Reuse the CUDA and Python dependency caches
        run: |
          set -euo pipefail
          command -v uv
          uv python find 3.12
          echo "$CUDA_HOME/bin" >> "$GITHUB_PATH"
          echo "UV_CACHE_DIR=$RUNNER_TOOL_CACHE/.warp-cache/uv" >> "$GITHUB_ENV"
          echo "PIP_CACHE_DIR=$RUNNER_TOOL_CACHE/.warp-cache/pip" >> "$GITHUB_ENV"

      - name: Install the exact wheel and prepare two header trees
        working-directory: ${{ runner.temp }}
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          unset TL_TEMPLATE_PATH PYTHONPATH
          output="$RUNNER_TEMP/warp-consumer-$GITHUB_RUN_ID"
          mkdir -p "$output"
          test "$(cat "$RUNNER_TEMP/consumer-wheelhouse/source-sha.txt")" = "$SOURCE_SHA"
          (cd "$GITHUB_WORKSPACE" && sha256sum -c \
            "$RUNNER_TEMP/consumer-wheelhouse/source-files.sha256")
          (cd "$RUNNER_TEMP/consumer-wheelhouse" && sha256sum -c wheel.sha256)
          mapfile -t wheels < <(find "$RUNNER_TEMP/consumer-wheelhouse" -maxdepth 1 -name 'tilelang-*.whl' -print)
          test "${#wheels[@]}" -eq 1
          wheel=${wheels[0]}
          test "$(sha256sum "$wheel" | cut -d' ' -f1)" = e6c3976e9edd8f661c68125b130e7284304e01b26e2e93d3cf88d79fe9287588
          uv venv --python 3.12 "$RUNNER_TEMP/tilelang-consumer-venv"
          uv pip install --python "$RUNNER_TEMP/tilelang-consumer-venv/bin/python" \
            'https://download-r2.pytorch.org/whl/cu130/torch-2.14.1%2Bcu130-cp312-cp312-manylinux_2_28_x86_64.whl#sha256=5359b255ac68c0cabb8293952b38e00f0d1a570815cd87f19b61af702c071410'
          uv pip install --python "$RUNNER_TEMP/tilelang-consumer-venv/bin/python" \
            "$wheel" 'pytest==9.1.1' 'cuda-bindings==13.4.3'
          "$RUNNER_TEMP/tilelang-consumer-venv/bin/python" - <<'PY'
          import hashlib, sys
          from pathlib import Path
          import tilelang
          from tilelang.env import TILELANG_TEMPLATE_PATH
          package = Path(tilelang.__file__).resolve()
          assert package.is_relative_to(Path(sys.prefix).resolve()), package
          assert Path(TILELANG_TEMPLATE_PATH).resolve() == package.parent / "src"
          actual = hashlib.sha256(Path(TILELANG_TEMPLATE_PATH, "tl_templates/cuda/reduce.h").read_bytes()).hexdigest()
          assert actual == "c0a751635c86f17c8a2a9c874c5473924a544894454ede1ddb5ff2b458a5dd00", actual
          print(f"installed_package={package} installed_header_sha256={actual}")
          PY
          mkdir -p "$RUNNER_TEMP/consumer-template-baseline" "$RUNNER_TEMP/consumer-template-candidate"
          cp -a "$GITHUB_WORKSPACE/source/src/." "$RUNNER_TEMP/consumer-template-baseline/"
          cp -a "$GITHUB_WORKSPACE/source/src/." "$RUNNER_TEMP/consumer-template-candidate/"
          git -C "$GITHUB_WORKSPACE/source" show \
            194c1b897aa5269e9a89d44c88efdf578a3df620:src/tl_templates/cuda/reduce.h \
            > "$RUNNER_TEMP/consumer-template-baseline/tl_templates/cuda/reduce.h"
          nvcc --version > "$output/nvcc.txt"
          /usr/bin/g++-15 --version > "$output/cxx.txt"
          uv pip list --python "$RUNNER_TEMP/tilelang-consumer-venv/bin/python" --format=json \
            > "$output/packages.json"
          git -C "$GITHUB_WORKSPACE/consumer" rev-parse HEAD > "$output/consumer-commit.txt"
          cp "$GITHUB_WORKSPACE/consumer/LICENSE" "$output/consumer-license.txt"
          sha256sum "$GITHUB_WORKSPACE/validation/validation/warp-softmax-comparison.py" \
            > "$output/fixture.sha256"

      - name: Validate and measure the actual Engram kernel
        working-directory: ${{ runner.temp }}
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          wheel=$(find "$RUNNER_TEMP/consumer-wheelhouse" -maxdepth 1 -name 'tilelang-*.whl' -print)
          baseline_sha=$(sha256sum "$RUNNER_TEMP/consumer-template-baseline/tl_templates/cuda/reduce.h" | cut -d' ' -f1)
          candidate_sha=$(sha256sum "$RUNNER_TEMP/consumer-template-candidate/tl_templates/cuda/reduce.h" | cut -d' ' -f1)
          output="$RUNNER_TEMP/warp-consumer-$GITHUB_RUN_ID"
          "$RUNNER_TEMP/tilelang-consumer-venv/bin/python" \
            "$GITHUB_WORKSPACE/validation/validation/warp-softmax-comparison.py" \
            --workload engram --consumer-root "$GITHUB_WORKSPACE/consumer" \
            --baseline-template "$RUNNER_TEMP/consumer-template-baseline" \
            --candidate-template "$RUNNER_TEMP/consumer-template-candidate" \
            --baseline-header-sha "$baseline_sha" --candidate-header-sha "$candidate_sha" \
            --source-sha "$SOURCE_SHA" --wheel-source-sha "$SOURCE_SHA" \
            --wheel-path "$wheel" --wheel-sha e6c3976e9edd8f661c68125b130e7284304e01b26e2e93d3cf88d79fe9287588 \
            --output-dir "$output/measurement" 2>&1 | tee "$output/comparison.log"

      - name: Check the preserved softmax role and empty-graph rejection
        working-directory: ${{ runner.temp }}
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          wheel=$(find "$RUNNER_TEMP/consumer-wheelhouse" -maxdepth 1 -name 'tilelang-*.whl' -print)
          baseline_sha=$(sha256sum "$RUNNER_TEMP/consumer-template-baseline/tl_templates/cuda/reduce.h" | cut -d' ' -f1)
          candidate_sha=$(sha256sum "$RUNNER_TEMP/consumer-template-candidate/tl_templates/cuda/reduce.h" | cut -d' ' -f1)
          output="$RUNNER_TEMP/warp-consumer-$GITHUB_RUN_ID"
          script="$GITHUB_WORKSPACE/validation/validation/warp-softmax-comparison.py"
          args=(
            --baseline-template "$RUNNER_TEMP/consumer-template-baseline"
            --candidate-template "$RUNNER_TEMP/consumer-template-candidate"
            --baseline-header-sha "$baseline_sha" --candidate-header-sha "$candidate_sha"
            --source-sha "$SOURCE_SHA" --wheel-source-sha "$SOURCE_SHA"
            --wheel-path "$wheel" --wheel-sha e6c3976e9edd8f661c68125b130e7284304e01b26e2e93d3cf88d79fe9287588
          )
          "$RUNNER_TEMP/tilelang-consumer-venv/bin/python" - "$script" "$RUNNER_TEMP/consumer-empty-capture.py" <<'PY'
          from pathlib import Path
          import sys
          source = Path(sys.argv[1]).read_text()
          correct = "torch.cuda.graph(graph, stream=stream)"
          assert source.count(correct) == 1
          Path(sys.argv[2]).write_text(source.replace(correct, "torch.cuda.graph(graph)"))
          PY
          if "$RUNNER_TEMP/tilelang-consumer-venv/bin/python" "$RUNNER_TEMP/consumer-empty-capture.py" \
            "${args[@]}" --output-dir "$output/negative-capture" > "$output/negative-capture.log" 2>&1; then
            echo 'Empty-capture negative control unexpectedly passed' >&2
            exit 1
          fi
          "$RUNNER_TEMP/tilelang-consumer-venv/bin/python" - "$output/negative-capture.log" <<'PY'
          from pathlib import Path
          import sys
          log = Path(sys.argv[1]).read_text()
          assert "expected 128 captured kernel nodes; got 0" in log, log
          print("EMPTY_CAPTURE_NEGATIVE_CONTROL_FAILED_AS_EXPECTED")
          PY
          "$RUNNER_TEMP/tilelang-consumer-venv/bin/python" "$script" \
            "${args[@]}" --output-dir "$output/softmax-replay" 2>&1 | tee "$output/softmax-replay.log"

      - name: Upload consumer provenance and raw timing evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: warp-consumer-comparison
          path: |
            ${{ runner.temp }}/warp-consumer-${{ github.run_id }}/
            !${{ runner.temp }}/warp-consumer-${{ github.run_id }}/**/input-*.bin
            !${{ runner.temp }}/warp-consumer-${{ github.run_id }}/**/*-output.bin
          if-no-files-found: warn
          retention-days: 7

  build-wheel:
    if: ${{ inputs.validation_kind == 'wheel' }}
    name: Build exact-source CUDA wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
      USE_CUDA: "ON"
      USE_ROCM: "OFF"
      USE_ASCEND: "OFF"
      USE_METAL: "OFF"
      USE_LLVM: "OFF"
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source scope and submodule identities
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          BASELINE_SHA=ebb0de0d81abde83948238f361efda6fb0d745da
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          git -C source cat-file -e "${BASELINE_SHA}^{commit}"
          git -C source merge-base --is-ancestor "$BASELINE_SHA" "$SOURCE_SHA"

          expected_files=$(printf '%s\n' \
            docs/programming_guides/instructions.md \
            src/cuda/codegen/codegen_cuda.cc \
            src/cuda/codegen/codegen_cuda.h \
            src/tl_templates/cuda/reduce.h \
            testing/python/language/test_tilelang_language_warp_reduce.py)
          actual_files=$(git -C source diff --name-only "$BASELINE_SHA" "$SOURCE_SHA" | LC_ALL=C sort)
          if [[ "$actual_files" != "$expected_files" ]]; then
            printf 'Unexpected files in source patch:\n%s\n' "$actual_files"
            exit 1
          fi

          git -C source submodule update --init --recursive --depth 1 --jobs 2
          submodule_status=$(git -C source submodule status --recursive)
          printf '%s\n' "$submodule_status"
          if grep -qE '^[-+U]' <<<"$submodule_status"; then
            echo "A recursive submodule is missing or does not match its gitlink." >&2
            exit 1
          fi
          for path in 3rdparty/tvm 3rdparty/cutlass; do
            expected=$(git -C source rev-parse "$SOURCE_SHA:$path")
            actual=$(git -C "source/$path" rev-parse HEAD)
            test "$actual" = "$expected"
          done

          printf 'SOURCE_SHA=%s\nBASELINE_SHA=%s\n' "$SOURCE_SHA" "$BASELINE_SHA"
          (cd source && sha256sum \
            src/tl_templates/cuda/reduce.h \
            testing/python/language/test_tilelang_language_warp_reduce.py \
            testing/python/jit/test_tilelang_jit_nvrtc_std.py)

      - name: Cache Python build downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/pip
          key: tile-wheel-pip-ubuntu24-py312-${{ hashFiles('source/pyproject.toml') }}
          restore-keys: |
            tile-wheel-pip-ubuntu24-py312-

      - name: Cache C++ compilation
        uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639
        with:
          max-size: "2GB"
          create-symlink: true
          evict-old-files: "7d"
          append-timestamp: false
          key: tile-wheel-ubuntu24-py312-cuda130-${{ inputs.source_sha }}
          restore-keys: |
            tile-wheel-ubuntu24-py312-cuda130-

      - name: Set up Python 3.12
        run: |
          set -euo pipefail
          build_venv="$RUNNER_TEMP/tilelang-build-venv"
          python3.12 -m venv "$build_venv"
          echo "VIRTUAL_ENV=$build_venv" >> "$GITHUB_ENV"
          echo "$build_venv/bin" >> "$GITHUB_PATH"
          "$build_venv/bin/python" --version

      - name: Install pinned build and CUDA toolchains
        run: |
          set -euo pipefail
          build_python="$RUNNER_TEMP/tilelang-build-venv/bin/python"
          "$build_python" -m pip install --disable-pip-version-check --upgrade pip
          "$build_python" -m pip install --disable-pip-version-check \
            build \
            'cython>=3.1.0' \
            scikit-build-core \
            'cmake>=3.26.1' \
            'z3-solver>=4.13.0,<4.15.5' \
            'patchelf>=0.17.2'

          cat > "$RUNNER_TEMP/cuda-toolchain-requirements.txt" <<'EOF'
          nvidia-cuda-nvcc==13.0.88 --hash=sha256:56fe502eb77625a12f25172caa3cdddb4e4c8ba2c8c17dba44b164761b380f03
          nvidia-cuda-cccl==13.0.85 --hash=sha256:e0da7ad981f3a8aff08241b5bfc1af868742a63e2762f53a5171c492ef242649
          nvidia-cuda-runtime==13.0.96 --hash=sha256:7f82250d7782aa23b6cfe765ecc7db554bd3c2870c43f3d1821f1d18aebf0548
          nvidia-cuda-nvrtc==13.0.88 --hash=sha256:ad9b6d2ead2435f11cbb6868809d2adeeee302e9bb94bcf0539c7a40d80e8575
          nvidia-nvvm==13.0.88 --hash=sha256:c5f41ffeb6466944a026dfa5317d7d85355c119bbec279205d22f1869d1054e0
          nvidia-cuda-crt==13.0.88 --hash=sha256:2c8043c7c9e02492716426e9919fc78d2c5b3b2a7a768a88e952676b08aa55a4
          EOF
          "$build_python" -m pip install --disable-pip-version-check \
            --require-hashes -r "$RUNNER_TEMP/cuda-toolchain-requirements.txt"

          find "$RUNNER_TEMP/tilelang-build-venv/lib" \
            -path '*/nvidia/cu13/bin/nvcc' -type f -print -quit \
            | tee "$RUNNER_TEMP/pip-nvcc-path.txt"
          nvcc_path=$(cat "$RUNNER_TEMP/pip-nvcc-path.txt")
          test -n "$nvcc_path"
          "$nvcc_path" --version | tee "$RUNNER_TEMP/pip-nvcc-version.txt"
          "$build_python" -m pip list --format=freeze \
            | tee "$RUNNER_TEMP/build-python-packages.txt"

      - name: Build one CUDA-only native wheel
        working-directory: source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          WITH_PIP_CUDA_TOOLCHAIN: ${{ runner.temp }}/tilelang-build-venv
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dist" "$RUNNER_TEMP/tilelang-wheel-artifact"
          build_python="$RUNNER_TEMP/tilelang-build-venv/bin/python"
          nvcc_path=$(cat "$RUNNER_TEMP/pip-nvcc-path.txt")
          nvrtc_header="${nvcc_path%/bin/nvcc}/include/nvrtc.h"
          test -f "$nvrtc_header"
          "$build_python" -m build --verbose --wheel --no-isolation \
            --outdir "$RUNNER_TEMP/dist" 2>&1 \
            | tee "$RUNNER_TEMP/tilelang-wheel-build.log"
          cmake_cache="$GITHUB_WORKSPACE/source/build/CMakeCache.txt"
          test -f "$cmake_cache"
          grep -E '^(CMAKE_CUDA_COMPILER|CUDAToolkit_ROOT|TILELANG_CUDA_TOOLKIT_SOURCE|USE_CUDA):' \
            "$cmake_cache" | tee "$RUNNER_TEMP/tilelang-cuda-cache.txt"
          grep -Fxq "CMAKE_CUDA_COMPILER:STRING=$nvcc_path" "$cmake_cache"
          grep -Fxq "CUDAToolkit_ROOT:PATH=${nvcc_path%/bin/nvcc}" "$cmake_cache"
          grep -Fxq "TILELANG_CUDA_TOOLKIT_SOURCE:INTERNAL=pip" "$cmake_cache"
          grep -Fxq "USE_CUDA:STRING=ON" "$cmake_cache"

          mapfile -t wheels < <(find "$RUNNER_TEMP/dist" -maxdepth 1 \
            -type f -name 'tilelang-*.whl' -print | sort)
          test "${#wheels[@]}" -eq 1
          wheel="${wheels[0]}"
          case "$(basename "$wheel")" in
            tilelang-*-cp39-abi3-linux_x86_64.whl) ;;
            *) echo "Unexpected native wheel filename: $wheel" >&2; exit 1 ;;
          esac
          if [[ "$wheel" == *manylinux* ]]; then
            echo "This validation builds a native Linux wheel, not manylinux." >&2
            exit 1
          fi

          "$build_python" - "$wheel" src/tl_templates/cuda/reduce.h <<'PY'
          import hashlib
          import sys
          import zipfile
          from pathlib import Path

          wheel, source_header = map(Path, sys.argv[1:])
          expected = hashlib.sha256(source_header.read_bytes()).hexdigest()
          with zipfile.ZipFile(wheel) as archive:
              member = "tilelang/src/tl_templates/cuda/reduce.h"
              assert member in archive.namelist(), f"wheel omitted {member}"
              actual = hashlib.sha256(archive.read(member)).hexdigest()
          assert actual == expected, f"wheel header hash mismatch: {actual} != {expected}"
          print(f"wheel_header_sha256={actual}")
          PY

          cp "$wheel" "$RUNNER_TEMP/tilelang-wheel-artifact/"
          cp "$RUNNER_TEMP/tilelang-wheel-build.log" "$RUNNER_TEMP/tilelang-wheel-artifact/"
          cp "$RUNNER_TEMP/build-python-packages.txt" "$RUNNER_TEMP/tilelang-wheel-artifact/"
          cp "$RUNNER_TEMP/tilelang-cuda-cache.txt" "$RUNNER_TEMP/tilelang-wheel-artifact/"
          printf '%s\n' "$SOURCE_SHA" > "$RUNNER_TEMP/tilelang-wheel-artifact/source-sha.txt"
          (cd "$RUNNER_TEMP/tilelang-wheel-artifact" && \
            sha256sum "$(basename "$wheel")" > wheel.sha256)
          (cd "$GITHUB_WORKSPACE" && sha256sum \
            source/src/tl_templates/cuda/reduce.h \
            source/testing/python/language/test_tilelang_language_warp_reduce.py \
            source/testing/python/jit/test_tilelang_jit_nvrtc_std.py) \
            > "$RUNNER_TEMP/tilelang-wheel-artifact/source-files.sha256"
          git submodule status --recursive \
            > "$RUNNER_TEMP/tilelang-wheel-artifact/submodules.txt"

      - name: Upload exact-source native wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tilelang-native-wheel
          path: ${{ runner.temp }}/tilelang-wheel-artifact/
          if-no-files-found: error
          retention-days: 3

  wheel-gpu:
    if: ${{ inputs.validation_kind == 'wheel' }}
    needs: build-wheel
    name: Test installed wheel on CUDA
    runs-on: [self-hosted, linux, x64, warp-validation]
    timeout-minutes: 35
    env:
      CUDA_HOME: /home/sgtpepper/.local/cuda-13.3
      NVCC_CCBIN: /usr/bin/g++-15
      CXX: /usr/bin/g++-15
      TILELANG_DISABLE_CACHE: "1"
      UV_HTTP_TIMEOUT: "300"
      UV_CONCURRENT_DOWNLOADS: "3"
      PYTHONPATH: ""
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Download exact-source wheel and hashes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: tilelang-native-wheel
          path: ${{ runner.temp }}/tilelang-wheelhouse

      - name: Reuse Python 3.12 and dependency caches
        run: |
          set -euo pipefail
          command -v uv
          uv --version
          uv python find 3.12
          /usr/bin/g++-15 --version
          echo "$CUDA_HOME/bin" >> "$GITHUB_PATH"
          echo "UV_CACHE_DIR=$RUNNER_TOOL_CACHE/.warp-cache/uv" >> "$GITHUB_ENV"
          echo "PIP_CACHE_DIR=$RUNNER_TOOL_CACHE/.warp-cache/pip" >> "$GITHUB_ENV"

      - name: Verify source, wheel, and installed template identity
        working-directory: ${{ runner.temp }}
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          TILELANG_CACHE_DIR: ${{ runner.temp }}/tilelang-native-wheel-cache
        run: |
          set -euo pipefail
          unset TL_TEMPLATE_PATH PYTHONPATH
          mkdir -p "$GITHUB_WORKSPACE/wheel-results"
          BASELINE_SHA=ebb0de0d81abde83948238f361efda6fb0d745da
          test "$(git -C "$GITHUB_WORKSPACE/source" rev-parse HEAD)" = "$SOURCE_SHA"
          git -C "$GITHUB_WORKSPACE/source" merge-base --is-ancestor \
            "$BASELINE_SHA" "$SOURCE_SHA"

          (cd "$GITHUB_WORKSPACE" && sha256sum -c \
            "$RUNNER_TEMP/tilelang-wheelhouse/source-files.sha256")
          test "$(cat "$RUNNER_TEMP/tilelang-wheelhouse/source-sha.txt")" = "$SOURCE_SHA"

          mapfile -t wheels < <(find "$RUNNER_TEMP/tilelang-wheelhouse" \
            -maxdepth 1 -type f -name 'tilelang-*.whl' -print | sort)
          test "${#wheels[@]}" -eq 1
          wheel="${wheels[0]}"
          case "$(basename "$wheel")" in
            tilelang-*-cp39-abi3-linux_x86_64.whl) ;;
            *) echo "Unexpected native wheel filename: $wheel" >&2; exit 1 ;;
          esac
          (cd "$RUNNER_TEMP/tilelang-wheelhouse" && sha256sum -c wheel.sha256) \
            | tee "$GITHUB_WORKSPACE/wheel-results/wheel.sha256"

          uv venv --python 3.12 "$RUNNER_TEMP/tilelang-wheel-venv"
          uv pip install --python "$RUNNER_TEMP/tilelang-wheel-venv/bin/python" \
            'https://download-r2.pytorch.org/whl/cu130/torch-2.14.1%2Bcu130-cp312-cp312-manylinux_2_28_x86_64.whl#sha256=5359b255ac68c0cabb8293952b38e00f0d1a570815cd87f19b61af702c071410'
          uv pip install --python "$RUNNER_TEMP/tilelang-wheel-venv/bin/python" \
            "$wheel" 'pytest==9.1.1' 'cuda-bindings==13.4.3'

          cp "$GITHUB_WORKSPACE/source/testing/python/language/test_tilelang_language_warp_reduce.py" \
            "$RUNNER_TEMP/test_tilelang_language_warp_reduce.py"
          cp "$GITHUB_WORKSPACE/source/testing/python/jit/test_tilelang_jit_nvrtc_std.py" \
            "$RUNNER_TEMP/test_tilelang_jit_nvrtc_std.py"
          cmp "$GITHUB_WORKSPACE/source/testing/python/language/test_tilelang_language_warp_reduce.py" \
            "$RUNNER_TEMP/test_tilelang_language_warp_reduce.py"
          cmp "$GITHUB_WORKSPACE/source/testing/python/jit/test_tilelang_jit_nvrtc_std.py" \
            "$RUNNER_TEMP/test_tilelang_jit_nvrtc_std.py"
          sha256sum "$RUNNER_TEMP/test_tilelang_language_warp_reduce.py" \
            "$RUNNER_TEMP/test_tilelang_jit_nvrtc_std.py" \
            | tee "$GITHUB_WORKSPACE/wheel-results/test-files.sha256"

          nvcc --version | tee "$GITHUB_WORKSPACE/wheel-results/nvcc.txt"
          nvidia-smi --query-gpu=name,compute_cap,memory.total,driver_version --format=csv,noheader \
            | tee "$GITHUB_WORKSPACE/wheel-results/gpu.txt"
          "$RUNNER_TEMP/tilelang-wheel-venv/bin/python" - <<'PY' \
            | tee "$GITHUB_WORKSPACE/wheel-results/runtime.txt"
          import hashlib
          import importlib.metadata as metadata
          import os
          import sys
          from pathlib import Path

          assert "TL_TEMPLATE_PATH" not in os.environ
          assert "PYTHONPATH" not in os.environ
          import tilelang
          import torch
          from cuda.bindings import nvrtc
          from tilelang.env import TILELANG_TEMPLATE_PATH

          package_path = Path(tilelang.__file__).resolve()
          assert package_path.is_relative_to(Path(sys.prefix).resolve()), package_path
          source_root = Path(os.environ["GITHUB_WORKSPACE"], "source").resolve()
          assert not package_path.is_relative_to(source_root), package_path
          template_root = Path(TILELANG_TEMPLATE_PATH).resolve()
          assert template_root == package_path.parent / "src", template_root
          assert Path(os.environ["TL_TEMPLATE_PATH"]).resolve() == template_root
          assert Path(os.environ["PYTHONPATH"]).resolve() == package_path.parent / "3rdparty/tvm/python"
          packaged_header = template_root / "tl_templates/cuda/reduce.h"
          source_header = source_root / "src/tl_templates/cuda/reduce.h"
          packaged_hash = hashlib.sha256(packaged_header.read_bytes()).hexdigest()
          source_hash = hashlib.sha256(source_header.read_bytes()).hexdigest()
          assert packaged_hash == source_hash, f"{packaged_hash} != {source_hash}"
          assert torch.cuda.is_available(), "CUDA is required for this validation"
          assert torch.cuda.device_count() == 1, "Use the single-GPU warp-validation runner"
          assert torch.cuda.get_device_capability(0) == (12, 0), "Use the SM120 warp-validation GPU"

          print(f"source_sha={os.environ['SOURCE_SHA']}")
          print(f"tilelang={metadata.version('tilelang')} path={package_path}")
          print(f"template_root={template_root}")
          print(f"candidate_header_sha256={source_hash}")
          print(f"installed_header_sha256={packaged_hash}")
          print(f"torch={torch.__version__} cuda={torch.version.cuda} path={Path(torch.__file__).resolve()}")
          for distribution in ("cuda-bindings", "cuda-python", "pytest"):
              try:
                  print(f"{distribution}={metadata.version(distribution)}")
              except metadata.PackageNotFoundError:
                  print(f"{distribution}=not-installed")
          result, major, minor = nvrtc.nvrtcVersion()
          assert result == nvrtc.nvrtcResult.NVRTC_SUCCESS
          print(f"nvrtc={major}.{minor}")
          print(f"gpu={torch.cuda.get_device_name(0)} capability={torch.cuda.get_device_capability(0)}")
          PY

      - name: Run 243 reducer/codegen and 14 NVRTC cases with the installed default template
        working-directory: ${{ runner.temp }}
        env:
          TILELANG_CACHE_DIR: ${{ runner.temp }}/tilelang-native-wheel-cache
        run: |
          set -euo pipefail
          unset TL_TEMPLATE_PATH PYTHONPATH
          python_bin="$RUNNER_TEMP/tilelang-wheel-venv/bin/python"
          test_file="$RUNNER_TEMP/test_tilelang_language_warp_reduce.py"
          nvrtc_test_file="$RUNNER_TEMP/test_tilelang_jit_nvrtc_std.py"

          "$python_bin" -m pytest -q \
            --junitxml="$GITHUB_WORKSPACE/wheel-results/patched.xml" \
            "$test_file" 2>&1 | tee "$GITHUB_WORKSPACE/wheel-results/patched.log"
          "$python_bin" - "$GITHUB_WORKSPACE/wheel-results/patched.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          cases = ET.parse(sys.argv[1]).getroot().findall(".//testcase")
          assert len(cases) == 243, f"expected 243 regression/codegen cases; got {len(cases)}"
          failures = [case.get("name") for case in cases if case.find("failure") is not None]
          errors = [case.get("name") for case in cases if case.find("error") is not None]
          skipped = [case.get("name") for case in cases if case.find("skipped") is not None]
          assert not failures, f"unexpected failures: {failures}"
          assert not errors, f"unexpected errors: {errors}"
          assert not skipped, f"CUDA regressions must not be skipped: {skipped}"
          print(f"PATCHED_CASES_PASSED={len(cases)}; SKIPPED=0")
          PY

          "$python_bin" -m pytest -q \
            --junitxml="$GITHUB_WORKSPACE/wheel-results/nvrtc.xml" \
            "$nvrtc_test_file" 2>&1 | tee "$GITHUB_WORKSPACE/wheel-results/nvrtc.log"
          "$python_bin" - "$GITHUB_WORKSPACE/wheel-results/nvrtc.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          cases = ET.parse(sys.argv[1]).getroot().findall(".//testcase")
          assert len(cases) == 14, f"expected 14 NVRTC cases; got {len(cases)}"
          failures = [case.get("name") for case in cases if case.find("failure") is not None]
          errors = [case.get("name") for case in cases if case.find("error") is not None]
          skipped = [case.get("name") for case in cases if case.find("skipped") is not None]
          assert not failures, f"unexpected NVRTC failures: {failures}"
          assert not errors, f"unexpected NVRTC errors: {errors}"
          assert not skipped, f"NVRTC cases must not be skipped: {skipped}"
          print(f"NVRTC_CASES_PASSED={len(cases)}; SKIPPED=0")
          PY

      - name: Upload installed-wheel validation results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tilelang-native-wheel-results
          path: wheel-results/
          if-no-files-found: warn
          retention-days: 7
